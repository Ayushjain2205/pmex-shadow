services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pmex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: `docker compose run --rm migrate upgrade head`
  migrate:
    build: .
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env

  watcher:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./bots:/app/bots
      - ./secrets:/app/secrets
      - ./policy.yaml:/app/policy.yaml
    command: ["watcher"]
    restart: unless-stopped

  control:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:${PMEX_CONTROL_HOST_PORT:-8877}:8080"
    command: ["control", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: ["backup", "--schedule", "0 */6 * * *"]
    restart: unless-stopped

  # target_stats (size percentiles, hit rate, PnL, reversal rate, decay/dormancy
  # auto-pause) has no other writer — targets/stats.py's own docstring says this is
  # "meant to run on a scheduled job," but nothing ever actually ran it: found via
  # every column on the Targets page being permanently blank despite thousands of
  # ingested fills, which in turn meant policy/sizing.py's percentile_of_value() was
  # reading size_p50..p95 as 0 for every target — every fill landed above all four
  # (zero) breakpoints, so real trades were being sized at the curve's max
  # multiplier unconditionally, not scaled by actual conviction. 15 minutes: frequent
  # enough that sizing percentiles track live trading activity on these targets'
  # mostly-15-minute markets, infrequent enough not to hammer the public positions
  # API compute_hit_rate_and_pnl() calls per target.
  targets-recompute:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
    command: ["targets", "recompute", "--schedule", "*/15 * * * *"]
    restart: unless-stopped

volumes:
  pgdata:
