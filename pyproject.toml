[project]
name = "pmex-shadow"
version = "0.1.0"
description = "Copy-trading execution infrastructure for Polymarket"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.13",
    "prometheus-client>=0.21",
    "web3>=7.4",
    "eth-account>=0.13",
    "polymarket-client==0.2.0",
    "croniter>=3.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "eth-abi>=5.1",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
pmex-shadow = "pmex_shadow.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pmex_shadow*"]

[tool.setuptools.package-data]
# setuptools only ships .py files by default -- templates/static are data files and
# need declaring explicitly, or they silently vanish from the installed wheel (found
# via a live TemplateNotFound in the built Docker image, not by reading the config).
pmex_shadow = ["control/templates/*.html", "control/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
