<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pmex-shadow{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-BBDmZzVt6vjz5YbUqWyvyJqRt1AlU/lJDLGOL2XwqzTVYh27fWvJZfxCXcphqDF5" crossorigin="anonymous"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: Canvas; color: CanvasText; }
    nav { display: flex; gap: 1.5rem; padding: 0.75rem 1.5rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); align-items: center; }
    nav a { color: inherit; text-decoration: none; font-weight: 600; opacity: 0.75; }
    nav a:hover, nav a.active { opacity: 1; }
    nav .brand { font-weight: 700; margin-right: 1rem; }
    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, transparent); font-size: 0.9rem; }
    th { opacity: 0.6; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    .pill { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .pill-active, .pill-filled, .pill-applied, .pill-resolved, .pill-redeemed { background: color-mix(in srgb, #22c55e 25%, transparent); color: #16a34a; }
    .pill-pending_resolution, .pill-built, .pill-submitted, .pill-acked { background: color-mix(in srgb, #eab308 25%, transparent); color: #a16207; }
    .pill-paused_decay, .pill-paused_dormant, .pill-paused_manual, .pill-rejected, .pill-CRITICAL, .pill-rejected_order, .pill-written_off, .pill-disputed { background: color-mix(in srgb, #ef4444 25%, transparent); color: #dc2626; }
    .pill-WARN { background: color-mix(in srgb, #f97316 25%, transparent); color: #ea580c; }
    .pill-INFO { background: color-mix(in srgb, #64748b 20%, transparent); color: #475569; }
    .pill-COPY { background: color-mix(in srgb, #3b82f6 25%, transparent); color: #2563eb; }
    .pill-SKIP { background: color-mix(in srgb, #eab308 25%, transparent); color: #a16207; }
    /* Skip-reason categories (control/queries.py's _SKIP_REASON_META) — eight
       distinct hues, not three: slippage/stale/volatility all dominate real skip
       volume and used to share one color, which read as monochrome as having no
       categories at all. Each hue is a genuinely different signal, not decoration. */
    .pill-cat-capital { background: color-mix(in srgb, #ef4444 25%, transparent); color: #dc2626; }
    .pill-cat-position_limit { background: color-mix(in srgb, #14b8a6 25%, transparent); color: #0f766e; }
    .pill-cat-halted { background: color-mix(in srgb, #64748b 25%, transparent); color: #475569; }
    .pill-cat-timing { background: color-mix(in srgb, #eab308 25%, transparent); color: #a16207; }
    .pill-cat-slippage { background: color-mix(in srgb, #f97316 25%, transparent); color: #ea580c; }
    .pill-cat-chaos { background: color-mix(in srgb, #ec4899 25%, transparent); color: #be185d; }
    .pill-cat-filtered { background: color-mix(in srgb, #8b5cf6 25%, transparent); color: #7c3aed; }
    .pill-cat-data_gap { background: color-mix(in srgb, #0ea5e9 25%, transparent); color: #0369a1; }
    /* Bot mode + fleet-status pills (fleet.html). live is amber, not red/green —
       it's not "good" or "bad" on its own, it's "real money, pay attention," a
       distinct signal from paper's routine blue or a stale heartbeat's red. */
    .pill-paper { background: color-mix(in srgb, #3b82f6 22%, transparent); color: #2563eb; }
    .pill-live { background: color-mix(in srgb, #f59e0b 25%, transparent); color: #b45309; }
    .pill-watch { background: color-mix(in srgb, #64748b 20%, transparent); color: #475569; }
    .pill-stale { background: color-mix(in srgb, #ef4444 25%, transparent); color: #dc2626; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 12%, transparent); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .stat { display: inline-block; margin-right: 2rem; }
    .stat .label { font-size: 0.75rem; opacity: 0.6; text-transform: uppercase; }
    .stat .value { font-size: 1.4rem; font-weight: 700; }
    .stat-row { display: flex; flex-wrap: wrap; gap: 1.25rem 2rem; margin-bottom: 0.5rem; }
    .stat-row .stat { margin-right: 0; }
    .banner { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .banner-readonly { background: color-mix(in srgb, #f97316 15%, transparent); border: 1px solid color-mix(in srgb, #f97316 40%, transparent); }
    .banner-error { background: color-mix(in srgb, #ef4444 15%, transparent); border: 1px solid color-mix(in srgb, #ef4444 40%, transparent); }
    .banner-success { background: color-mix(in srgb, #22c55e 15%, transparent); border: 1px solid color-mix(in srgb, #22c55e 40%, transparent); }
    input, select { font: inherit; padding: 0.35rem 0.5rem; border-radius: 4px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: CanvasText; }
    input:disabled { opacity: 0.5; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin: 0.75rem 0 0.25rem; }
    .field-hint { font-size: 0.75rem; opacity: 0.6; margin-top: 0.15rem; }
    button { font: inherit; padding: 0.5rem 1rem; border-radius: 6px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
    button:hover { opacity: 0.9; }
    a.button { display: inline-block; text-decoration: none; }
    code { font-size: 0.85em; opacity: 0.8; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">pmex-shadow</span>
    <a href="/" class="{% if active_nav == 'fleet' %}active{% endif %}">Fleet</a>
    <a href="/targets" class="{% if active_nav == 'targets' %}active{% endif %}">Targets</a>
    <a href="/logs" class="{% if active_nav == 'logs' %}active{% endif %}">Logs</a>
  </nav>
  <main>
    {% if not writes_enabled %}
    <div class="banner banner-readonly">Read-only mode — set <code>PMEX_CONTROL_ALLOW_WRITES=1</code> to enable parameter changes (FR-C-8).</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Every timestamp on the page is rendered server-side in UTC (data-utc holds
    // the ISO string) and swapped to the viewer's local timezone here — the
    // server has no reliable way to know that, only the browser does.
    document.querySelectorAll("[data-utc]").forEach((el) => {
      const d = new Date(el.getAttribute("data-utc"));
      if (isNaN(d)) return;
      const opts = { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
      if (el.getAttribute("data-mode") !== "time") {
        Object.assign(opts, { year: "numeric", month: "2-digit", day: "2-digit" });
      }
      el.textContent = d.toLocaleString(undefined, opts);
    });
  </script>
</body>
</html>
